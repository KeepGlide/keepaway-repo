<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">KeepAway Repo mark, the checkpoint: a Sky milestone ring crossed by the kite, one Coral dot for the progress mark, on a navy squircle</title>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="kite-clip">
      <path d="M637.4 279.9 L671.7 455.7 L446.6 572.2 L464.2 318.3 Z"/>
    </clipPath>
  </defs>
  <g id="icon-background">
    <rect x="64" y="64" width="896" height="896" rx="210" fill="#1E2A47"/>
  </g>
  <g id="ring">
    <circle cx="512" cy="512" r="300" fill="none" stroke="#9AD9E6" stroke-width="64"/>
    <circle cx="512" cy="212" r="56" fill="#F2715F"/>
  </g>
  <g transform="translate(700 330) scale(1.1) translate(-559.15 -426.05)">
    <g id="kite">
      <path d="M637.4 279.9 L464.2 318.3 L446.6 572.2 Z" fill="#2BB8AE"/>
      <path d="M637.4 279.9 L671.7 455.7 L446.6 572.2 Z" fill="#7EE8DC"/>
      <g clip-path="url(#kite-clip)" fill="#F2715F">
        <circle cx="637.4" cy="279.9" r="43"/>
        <circle cx="464.2" cy="318.3" r="36"/>
        <circle cx="671.7" cy="455.7" r="36"/>
        <circle cx="446.6" cy="572.2" r="74"/>
      </g>
      <g stroke="#3A4766" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="637.4" y1="279.9" x2="446.6" y2="572.2"/>
        <path d="M464.2 318.3 C602.6 353.3 607.4 378.2 671.7 455.7"/>
      </g>
    </g>
    </g>

</svg>
